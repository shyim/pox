[package]
name = "pox-cli"
description = "PHP CLI embedded in a static binary"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "pox"
path = "src/main.rs"

[dependencies]
pox-embed = { path = "../pox-embed" }
riff = { git = "https://github.com/shyim/riff.git", rev = "96879c9cb48f6ed9620d6ab634fdf79b6f3e8e6b", default-features = false }
riff-core = { git = "https://github.com/shyim/riff.git", rev = "96879c9cb48f6ed9620d6ab634fdf79b6f3e8e6b" }
# The embedded PHP archive already provides BZ2_* symbols. Reuse them instead
# of compiling the second copy requested by Riff's static bzip2 feature.
bzip2-sys = { version = "0.1.13", features = ["__disabled"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
notify = "8"
notify-debouncer-full = "0.7"
globset = "0.4"
