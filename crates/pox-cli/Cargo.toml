[package]
name = "pox-cli"
description = "PHP CLI embedded in a static binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pox"
path = "src/main.rs"

[dependencies]
pox-embed = { path = "../pox-embed" }
riff = { git = "https://github.com/shyim/riff.git", rev = "96879c9cb48f6ed9620d6ab634fdf79b6f3e8e6b", default-features = false }
riff-core = { git = "https://github.com/shyim/riff.git", rev = "96879c9cb48f6ed9620d6ab634fdf79b6f3e8e6b" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tiny_http = "0.12"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.23"
notify = "8"
notify-debouncer-full = "0.7"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.11"
hex = "0.4"
semver = "1"
tar = "0.4"
zstd = "0.13"
tempfile = "3"
