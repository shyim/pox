[package]
name = "pox-cli"
description = "PHP CLI embedded in a static binary"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "pox"
path = "src/main.rs"

[features]
runtime-integration = ["pox-embed/runtime-integration"]

[dependencies]
pox-embed = { path = "../pox-embed" }
riff = { git = "https://github.com/shyim/riff.git", rev = "58987fe74c926f3c63f46970cf3c2d2d64e1854c", default-features = false }
riff-core = { git = "https://github.com/shyim/riff.git", rev = "58987fe74c926f3c63f46970cf3c2d2d64e1854c" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }
httpdate = "1"
ipnet = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
toml_edit = "0.23"
notify = "8"
notify-debouncer-full = "0.7"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.11"
hex = "0.4"
semver = "1"
tar = "0.4"
zstd = "0.13"
tempfile = "3"
