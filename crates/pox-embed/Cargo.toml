[package]
name = "pox-embed"
description = "Safe loader for independently distributed Pox PHP runtimes"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
runtime-integration = []

[dependencies]
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
